name: Deploy ERP DigitalFuzed

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-erp-digitalfuzed
  cancel-in-progress: true

env:
  APP_PATH: /home/digitalfuzed-erp-cp/htdocs/erp.digitalfuzed.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Validate secrets
        if: secrets.SERVER_HOST == '' || secrets.SERVER_USER == '' || secrets.SERVER_SSH_KEY == ''
        run: |
          echo "::error::Missing deployment secrets. Set SERVER_HOST, SERVER_USER (the app user 'digitalfuzed-erp-cp', NOT root) and SERVER_SSH_KEY in GitHub repo Settings -> Secrets and variables -> Actions." >&2
          exit 1

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Sync files to server
        run: |
          # Server-owned runtime/data paths are excluded so rsync --delete never
          # removes them: .env, storage/installed (installer marker), logs,
          # framework caches, user-uploaded media, and uploads.
          rsync -az --delete --omit-dir-times --no-perms --no-owner --no-group \
            --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='tests' \
            --exclude='.env' --exclude='.env.backup' \
            --exclude='storage/installed' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/' \
            --exclude='storage/debugbar/' \
            --exclude='storage/app/public/media/' \
            --exclude='storage/app/public/uploads/' \
            --exclude='storage/app/temp/' \
            -e "ssh -i ~/.ssh/id_rsa -p 22 -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ env.APP_PATH }}/"

      - name: Remote post-deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_PATH="/home/digitalfuzed-erp-cp/htdocs/erp.digitalfuzed.com"
            APP_USER="digitalfuzed-erp-cp"
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

            # We SSH in as $APP_USER (NOT root), so synced/installed files are
            # owned by the app user. Root is only used via passwordless sudo for
            # the service commands that genuinely need it (see sudoers note below).
            cd "$APP_PATH"

            mkdir -p storage/logs bootstrap/cache \
              storage/framework/sessions storage/framework/views \
              storage/framework/cache/data
            if [ -f .env.example ] && [ ! -f .env ]; then
              cp .env.example .env
            fi

            chmod -R ug+rwx storage bootstrap/cache

            # One-time ownership repair for files left by older root-based deploys.
            # Requires: sudoers entry "$APP_USER ALL=(root) NOPASSWD: ALL" or a
            # narrow rule covering chown/systemctl/nginx/php-fpm8.4.
            sudo -n chown -R "$APP_USER:$APP_USER" .

            # Keep root-style serving compatible with Laravel build and media URLs.
            [ -e build ] || ln -s public/build build
            mkdir -p storage/app/public/media
            if [ -e storage/media ] && [ ! -L storage/media ]; then
              rm -rf storage/media
            fi
            [ -e storage/media ] || ln -s app/public/media storage/media

            # Publish LandingPage package images expected by storage/media URL paths.
            LP_DST="storage/app/public/media/packages/workdo/LandingPage/src/Resources/assets/img"
            mkdir -p "$LP_DST"
            cp -f packages/DigitalFuzed/LandingPage/src/Resources/assets/img/hero.png "$LP_DST/hero.png"
            cp -f packages/DigitalFuzed/LandingPage/src/Resources/assets/img/hrm.png "$LP_DST/hrm.png"
            cp -f packages/DigitalFuzed/LandingPage/src/Resources/assets/img/gallery1.jpeg "$LP_DST/gallery1.jpeg"

            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chown -h "$APP_USER:$APP_USER" build storage/media || true
            chown -R "$APP_USER:$APP_USER" storage/app/public/media || true

            # Only these need root, via passwordless sudo.
            sudo -n php-fpm8.4 -t
            sudo -n nginx -t
            sudo -n systemctl restart php8.4-fpm
            sudo -n systemctl reload nginx

            # Health check: site must answer on /login (200, or a redirect such as
            # 301/302/307). Otherwise the deploy is considered failed.
            sleep 2
            HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" -H "Host: erp.digitalfuzed.com" https://127.0.0.1/login || true)
            if [ "$HTTP_CODE" = "000" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: erp.digitalfuzed.com" http://127.0.0.1/login || true)
            fi
            echo "Health check HTTP $HTTP_CODE"
            case "$HTTP_CODE" in
              200|301|302|307) echo "Deploy OK";;
              *) echo "Health check failed with HTTP $HTTP_CODE" >&2; exit 1;;
            esac
